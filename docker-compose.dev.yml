# Dev-only PostgreSQL 16 (plan WU-M0-5, path A). Never a production topology.
# Hard rules (plan N17 — the legacy unauthenticated mongo:3.2 published to the
# host is the banned anti-pattern this file must not reproduce):
#   - bound to 127.0.0.1 only
#   - password required, injected from the environment (.env.local), no default
#   - data on a named volume
# Usage: docker compose --env-file .env.local -f docker-compose.dev.yml up -d db
# No script, test or npm task may require Docker: DATABASE_URL is the only contract (§4.1).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dosrevival
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: dosrevival_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dosrevival-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dosrevival -d dosrevival_dev']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dosrevival-pgdata:
