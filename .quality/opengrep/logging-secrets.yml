# Secrets-in-logs rules (plan WU-M2-2).
# opengrep/semgrep compatible. A credential that reaches a log line is a
# credential in every log aggregator, backup and incident-response copy.
rules:
  - id: js-secret-in-console-log
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A secret-named variable is being passed to console logging. Credentials,
      tokens and keys must never reach log output - log a redacted marker or an
      identifier instead.
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      source: "plan WU-M2-2 (secrets in log calls)"
    patterns:
      - pattern-either:
          - pattern: console.$METHOD(..., $SECRET, ...)
          - pattern: console.$METHOD(..., `...${$SECRET}...`, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(log|info|warn|error|debug|trace)$'
      - metavariable-regex:
          metavariable: $SECRET
          regex: '(?i)^.*(password|passwd|secret|token|api_?key|credential|private_?key|client_?secret|authorization)\w*$'

  - id: js-secret-property-in-console-log
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A secret-named property is being passed to console logging. Credentials,
      tokens and keys must never reach log output - log a redacted marker or an
      identifier instead.
    metadata:
      category: security
      cwe: "CWE-532"
      source: "plan WU-M2-2 (secrets in log calls)"
    patterns:
      - pattern: console.$METHOD(..., $OBJ.$PROP, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(log|info|warn|error|debug|trace)$'
      - metavariable-regex:
          metavariable: $PROP
          regex: '(?i)^(password|passwd|secret|token|api_?key|credential|private_?key|client_?secret|authorization)$'

  - id: js-secret-in-logger-call
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A secret-named value is being passed to a logger call (pino/winston-style
      logger.*). Credentials, tokens and keys must never reach log output.
    metadata:
      category: security
      cwe: "CWE-532"
      source: "plan WU-M2-2 (secrets in log calls)"
    patterns:
      - pattern-either:
          - pattern: $LOGGER.$METHOD(..., $SECRET, ...)
          - pattern: $LOGGER.$METHOD(..., `...${$SECRET}...`, ...)
      - metavariable-regex:
          metavariable: $LOGGER
          regex: '(?i)^(log(ger)?|pino|winston)$'
      - metavariable-regex:
          metavariable: $METHOD
          regex: '^(log|info|warn|error|debug|trace|fatal|child)$'
      - metavariable-regex:
          metavariable: $SECRET
          regex: '(?i)^.*(password|passwd|secret|token|api_?key|credential|private_?key|client_?secret|authorization)\w*$'
